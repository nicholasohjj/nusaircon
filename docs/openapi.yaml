components:
  parameters:
    MeterId:
      name: txtMtrId
      in: query
      required: true
      schema:
        type: string
        pattern: "^\\d{8}$"
        example: "12345678"
      description: Eight-digit EVS meter ID.
    Amount:
      name: txtAmount
      in: query
      required: true
      schema:
        type: string
        example: "10.00"
      description: Strict amount input. Plain numbers and `$`/`S$` prefixes are accepted; malformed mixed strings are rejected.
    ChatId:
      name: chatId
      in: query
      required: false
      schema:
        type: string
      description: Telegram chat ID for bot-started flows.
    Token:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: Sealed payment or result token.

  requestBodies:
    TokenJson:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token:
                type: string
    EncryptedPaymentForm:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [token, enc]
            properties:
              token:
                type: string
              enc:
                type: string
                description: RSA-encrypted card payload produced in the browser.
              netsMid:
                type: string
              netsTxnRef:
                type: string
              merchantTxnRef:
                type: string
              txnRand:
                type: string
              keyId:
                type: string
              hmac:
                type: string
              name:
                type: string
              expiryMonth:
                type: string
                example: "12"
              expiryYear:
                type: string
                example: "2028"
              consumerEmail:
                type: string
                format: email
              browserUserAgent:
                type: string

  schemas:
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        code:
          type: string
          example: INVALID_AMOUNT
        error:
          type: string

    TopupAvailability:
      type: object
      properties:
        audience:
          type: string
          enum: [nus, sutd]
        botAudience:
          type: string
          enum: [nus, sutd]
        enabled:
          type: boolean
        disabled:
          type: boolean
        message:
          type: string

    TopupStatusResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        topup:
          type: object
          properties:
            nus:
              $ref: "#/components/schemas/TopupAvailability"
            sutd:
              $ref: "#/components/schemas/TopupAvailability"

    BootstrapResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        stage:
          type: string
          example: enets_paymentlistener
        redirectUrl:
          type: string
          example: /webapp/pay?token=abc123

    SessionResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        tokenKind:
          type: string
          enum: [payment, result, ""]
          description: Empty only for legacy tokens created before token kinds were added.
        txtMtrId:
          type: string
          example: "12345678"
        txtAmount:
          type: string
          example: "20"
        address:
          type: string
        balance:
          type: string
        status:
          type: string
          example: pending
        reason:
          type: string
        merchantTxnRef:
          type: string
        receiptAvailable:
          type: boolean
        chatId:
          type: string
        netsMid:
          type: string
        netsTxnRef:
          type: string
        n:
          type: string
          description: eNETS RSA modulus for CP2/SUTD.
        e:
          type: string
          description: eNETS RSA exponent for CP2/SUTD.
        rsaModulus:
          type: string
          description: eNETS RSA modulus for CP2NUS.
        rsaExponent:
          type: string
          description: eNETS RSA exponent for CP2NUS.

    PaymentResultResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        resultToken:
          type: string
          description: Sealed result token for the React result page.
        source:
          type: string
          example: evs_transsum
        status:
          type: string
          enum: [success, failure, unknown]
        merchantTxnRef:
          type: string
        meterId:
          type: string
        address:
          type: string
        balance:
          type: string
        amount:
          type: string
        reason:
          type: string

    BalanceResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        txtMtrId:
          type: string
        address:
          type: string
        balance:
          type: string
        checkedAt:
          type: string
          format: date-time

    WebsiteLookupResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        mode:
          type: string
          enum: [balance, usage, topups]
        meterId:
          type: string
        hostel:
          type: string
        address:
          type: string
        balance:
          type: string
        checkedAt:
          type: string
          format: date-time
        usage:
          type: object
          description: Present when mode=usage.
        topups:
          type: object
          description: Present when mode=topups.
