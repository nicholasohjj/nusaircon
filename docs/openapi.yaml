openapi: 3.0.3
info:
  title: EVS Meter Tools API
  version: 1.0.0
  description: API documentation for EVS top-up WebApp, website lookup, and support routes.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: App
    description: Static app and service metadata
  - name: Website
    description: Standalone website lookup and feedback API
  - name: CP2
    description: Legacy CP2 payment flow for NUS meters that have not migrated
  - name: CP2NUS
    description: Primary CP2NUS payment flow for supported NUS hostel meters
  - name: SUTD
    description: SUTD payment flow

paths:
  /health:
    get:
      tags: [App]
      summary: Health check
      responses:
        "200":
          description: App is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /terms:
    get:
      tags: [App]
      summary: Redirect to the Terms of Use page
      responses:
        "302":
          description: Redirects to /app/terms

  /robots.txt:
    get:
      tags: [App]
      summary: Robots policy
      responses:
        "200":
          description: Plain-text robots policy

  /sitemap.xml:
    get:
      tags: [App]
      summary: XML sitemap
      responses:
        "200":
          description: XML sitemap

  /website/lookup:
    get:
      tags: [Website]
      summary: Look up meter balance, usage, or recent top-ups
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [balance, usage, topups]
            default: balance
        - $ref: "#/components/parameters/MeterId"
        - name: hostel
          in: query
          required: false
          schema:
            type: string
            enum: [cp2, cp2nus, sutd]
          description: Optional system hint. SUTD usage history is not currently available.
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteLookupResponse"
        "400":
          description: Invalid lookup mode, hostel, or meter ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
        "502":
          description: Upstream lookup failed

  /website/feedback:
    post:
      tags: [Website]
      summary: Submit website feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                message:
                  type: string
                  maxLength: 2000
                contact:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid rating
        "429":
          description: Rate limited

  /website/topup-status:
    get:
      tags: [Website]
      summary: Read current top-up availability for website flows
      responses:
        "200":
          description: Current NUS and SUTD top-up availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupStatusResponse"

  /webapp:
    get:
      tags: [CP2]
      summary: Start the CP2 browser/WebApp entry flow
      parameters:
        - $ref: "#/components/parameters/MeterId"
        - $ref: "#/components/parameters/Amount"
        - $ref: "#/components/parameters/ChatId"
      responses:
        "302":
          description: Redirects to /app/loading with meter details when available
        "400":
          description: Missing or invalid input

  /webapp/bootstrap:
    get:
      tags: [CP2]
      summary: Create a CP2 payment session
      parameters:
        - $ref: "#/components/parameters/MeterId"
        - $ref: "#/components/parameters/Amount"
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Payment session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "400":
          description: Invalid meter ID or amount
        "429":
          description: Rate limited
        "500":
          description: Bootstrap failed
        "502":
          description: EVS/eNETS upstream bootstrap failed

  /webapp/session:
    get:
      tags: [CP2]
      summary: Read a CP2 payment or result session
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Session details. Payment pages require tokenKind=payment; result pages require tokenKind=result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Missing, invalid, or expired token

  /webapp/pay:
    get:
      tags: [CP2]
      summary: Redirect to the CP2 React card payment page
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "302":
          description: Redirects to /app/pay
        "400":
          description: Missing, invalid, expired, or wrong-kind token

  /webapp/enets_pay:
    post:
      tags: [CP2]
      summary: Submit encrypted CP2 card details to eNETS
      requestBody:
        $ref: "#/components/requestBodies/EncryptedPaymentForm"
      responses:
        "200":
          description: Payment processed and result token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResultResponse"
        "400":
          description: Missing fields or invalid/expired/wrong-kind payment token
        "409":
          description: Duplicate payment submit is already processing
        "500":
          description: Payment error
        "502":
          description: eNETS or EVS callback parsing failed

  /webapp/result:
    get:
      tags: [CP2]
      summary: Redirect to the CP2 React result page
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "302":
          description: Redirects to /app/result
        "400":
          description: Missing, invalid, expired, or wrong-kind token

  /webapp/balance:
    get:
      tags: [CP2]
      summary: Fetch the latest CP2 balance for a session meter
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Balance lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "400":
          description: Invalid or expired token
        "502":
          description: Upstream balance lookup failed

  /webapp/notify:
    post:
      tags: [CP2]
      summary: Best-effort Telegram notification fallback
      requestBody:
        $ref: "#/components/requestBodies/TokenJson"
      responses:
        "200":
          description: Notification accepted

  /cp2nus/webapp:
    get:
      tags: [CP2NUS]
      summary: Start the CP2NUS browser/WebApp entry flow
      parameters:
        - $ref: "#/components/parameters/MeterId"
        - $ref: "#/components/parameters/Amount"
        - $ref: "#/components/parameters/ChatId"
      responses:
        "302":
          description: Redirects to /app/cp2nus/loading
        "400":
          description: Missing or invalid input

  /cp2nus/webapp/bootstrap:
    get:
      tags: [CP2NUS]
      summary: Create a CP2NUS payment session
      parameters:
        - $ref: "#/components/parameters/MeterId"
        - $ref: "#/components/parameters/Amount"
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Payment session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "400":
          description: Invalid meter ID or amount
        "429":
          description: Rate limited
        "500":
          description: Bootstrap failed

  /cp2nus/webapp/session:
    get:
      tags: [CP2NUS]
      summary: Read a CP2NUS payment or result session
      parameters:
        - $ref: "#/components/parameters/Token"
