        "302":
          description: Redirects to /app/cp2nus/pay
        "400":
          description: Missing, invalid, expired, or wrong-kind token

  /cp2nus/webapp/enets_pay:
    post:
      tags: [CP2NUS]
      summary: Submit encrypted CP2NUS card details to eNETS
      requestBody:
        $ref: "#/components/requestBodies/EncryptedPaymentForm"
      responses:
        "200":
          description: Payment processed and result token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResultResponse"
        "400":
          description: Missing fields or invalid/expired/wrong-kind payment token
        "409":
          description: Duplicate payment submit is already processing
        "500":
          description: Payment error

  /cp2nus/webapp/result:
    get:
      tags: [CP2NUS]
      summary: Redirect to the CP2NUS React result page
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "302":
          description: Redirects to /app/cp2nus/result
        "400":
          description: Missing, invalid, expired, or wrong-kind token

  /cp2nus/webapp/receipt:
    get:
      tags: [CP2NUS]
      summary: Return a cached CP2NUS receipt PDF when available
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Receipt PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Receipt is unavailable or token is not a result token

  /cp2nus/webapp/balance:
    get:
      tags: [CP2NUS]
      summary: Fetch the latest CP2NUS balance for a session meter
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Balance lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "400":
          description: Invalid or expired token
        "502":
          description: Upstream balance lookup failed

  /cp2nus/webapp/notify:
    post:
      tags: [CP2NUS]
      summary: Best-effort Telegram notification fallback
      requestBody:
